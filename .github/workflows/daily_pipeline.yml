name: Daily 104 Internship Pipeline

on:
  schedule:
    # 台灣時間每日凌晨 04:17 (UTC 20:17) 避開全球整點伺服器排隊延遲
    - cron: '17 20 * * *'
    # 台灣時間每日下午 16:00 (UTC 08:00) 下午排程
    - cron: '0 8 * * *'
  workflow_dispatch: # 支援手動一鍵觸發

permissions:
  contents: write

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Run pipeline unit tests
        run: |
          python scripts/pipeline.py --test

      - name: Execute daily internship pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash
          MAX_LLM_PER_RUN: 50
        run: |
          python scripts/crawler.py
          python scripts/analyzer.py
          python scripts/pipeline.py --backup

      - name: Commit updated data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ backup/
          if git diff --staged --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore(data): auto-update 104 internship data [skip ci]"
            git push
          fi
